---
- name: Get current account's username.
  shell: whoami
  register: homebrew_whoami
  changed_when: false
  check_mode: no

# Clone dotfiles
- name: Clone the dotfiles directory.
  git:
    repo: "{{ dotfiles_repo }}"
    version: "{{ dotfiles_branch }}"
    dest: "/Users/{{ homebrew_whoami.stdout }}/mac-ansible/dotfiles"
    update: yes
    accept_hostkey: yes
    depth: 1

- name: Run the dotfiles bootstrap.sh
  command: "/Users/{{ homebrew_whoami.stdout }}/mac-ansible/dotfiles/bootstrap.sh -f"

- name: Install Pip Libraries
  pip:
    name: "{{ pip_items }}"
    executable: pip3
    extra_args: "--ignore-installed"

- name: Install Ruby Gems
  gem:
    name: "{{ item }}"
  loop: "{{ gem_items }}"

- name: Install Node Packages
  npm:
    name: "{{ item }}"
    global: yes
    executable: /opt/homebrew/bin/npm
  loop: "{{ npm_items }}"

- name: Remove all crap from Dock
  shell: /opt/homebrew/bin/dockutil --remove '{{ item }}'
  register: shell_output
  failed_when: shell_output.rc not in [0, 1]
  changed_when: shell_output.rc == 0
  loop: "{{ dockitems_to_remove }}"

- name: Check if items in dock exist
  shell: /opt/homebrew/bin/dockutil --find '{{ item.name }}' || /opt/homebrew/bin/dockutil --add '{{ item.path }}'
  loop: "{{ dockitems_to_persist }}"
  loop_control:
    pause: 1

- name: Fix order
  shell: /opt/homebrew/bin/dockutil --move '{{ item.name }}' --position {{ item.pos }}
  loop: "{{ dockitems_to_persist }}"
  loop_control:
    pause: 1
  register: move_result
  retries: 3
  delay: 1
  until: move_result.rc == 0

- name: Hide the Dock
  shell: defaults write com.apple.dock autohide -bool true
  when: sysctl_vm_check.stdout == "0"

- name: Resize the Dock
  shell: defaults write com.apple.dock tilesize -int 50

- name: Turn Off Show suggested and recent apps
  shell: defaults write com.apple.dock show-recents -bool false

- name: Turn Off Automatically rearrange Spaces
  shell: defaults write com.apple.dock mru-spaces -bool false

- name: Show Menu bar background
  shell: defaults write -g SLSMenuBarUseBlurredAppearance -bool true

- name: Restart the Dock using launchctl
  ansible.builtin.shell: launchctl stop com.apple.Dock.agent
  failed_when: false
  changed_when: true

- name: Update Homebrew
  shell: /opt/homebrew/bin/brew upgrade
